<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GFX Play</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <div class="header">
            <h1>GFX Play</h1>
            <div class="balance">
                <img src="assets/star.png" alt="Stars" class="star-icon">
                <span id="balance">0</span>
            </div>
        </div>

        <div class="main-menu">
            <div class="menu-item inventory">
                <div class="menu-icon">📦</div>
                <span>INVENTORY</span>
            </div>
            <div class="menu-item roulette">
                <div class="menu-icon">🎡</div>
                <span>ROULETTE</span>
                <div class="timer" id="spin-timer">2:57:48</div>
            </div>
            <div class="menu-item minecraft new">
                <div class="menu-icon">⛏️</div>
                <span>MINECRAFT</span>
                <div class="new-badge">NEW!</div>
            </div>
            <div class="menu-item giveaways">
                <div class="menu-icon">🎁</div>
                <span>GIVEAWAYS</span>
            </div>
            <div class="menu-item upgrades">
                <div class="menu-icon">⚡</div>
                <span>UPGRADES</span>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
